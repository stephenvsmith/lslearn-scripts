name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: >-
            hoffman/submit/legacy
        env:
          SHELLCHECK_OPTS: --exclude=SC1091

  r-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lint/style dependencies
        run: install.packages(c("lintr", "styler"))
        shell: Rscript {0}

      - name: Check every R file parses
        run: |
          files <- list.files(".", pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          bad <- Filter(function(f) inherits(tryCatch(parse(f), error = function(e) e), "error"), files)
          if (length(bad) > 0) {
            cat("Failed to parse:\n"); print(bad)
            quit(status = 1)
          }
        shell: Rscript {0}

      # These scripts were carried over from an existing reproducibility
      # repo, so style/lint are advisory (reported, non-blocking) rather
      # than enforced — the parse check above is the real correctness gate.
      - name: styler (dry run, advisory)
        continue-on-error: true
        run: |
          changed <- styler::style_dir(".", dry = "on", filetype = "R")
          if (any(changed$changed)) {
            cat("The following files differ from tidyverse style (informational only):\n")
            print(changed$file[changed$changed])
          }
        shell: Rscript {0}

      - name: lintr (advisory)
        continue-on-error: true
        run: |
          lints <- lintr::lint_dir(".")
          print(lints)
        shell: Rscript {0}
